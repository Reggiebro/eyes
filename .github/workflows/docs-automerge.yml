name: docs-automerge

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    # Same-repo, non-draft PRs only: forks get a read-only token.
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Auto-merge if every changed file is docs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          files=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename')
          non_docs=$(printf '%s\n' "$files" | grep -Ev '^(docs/|intent/|LICENSE$|([^/.][^/]*/)*[^/]+\.md$)' || true)
          if [ -z "$files" ] || [ -n "$non_docs" ]; then
            # A later push added code: drop any auto-merge set by an earlier docs-only push.
            gh pr merge "$PR_URL" --disable-auto >/dev/null 2>&1 || true
            echo "Not docs-only; auto-merge left off."
            exit 0
          fi
          gh pr merge "$PR_URL" --auto --merge
