name: safety-llm-eval

on:
  pull_request:
    paths: ["packages/safety/**", "evals/safety/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - if: env.ANTHROPIC_API_KEY != ''
        run: pnpm run --if-present safety:eval
      - if: env.ANTHROPIC_API_KEY == ''
        run: echo "ANTHROPIC_API_KEY not set, skipping LLM classifier eval"
