name: safety-llm-eval

on:
  pull_request:
    paths: ["packages/safety/**", "evals/safety/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - if: env.ANTHROPIC_API_KEY != ''
        run: pnpm run --if-present safety:eval
      - if: env.ANTHROPIC_API_KEY == ''
        run: echo "ANTHROPIC_API_KEY not set, skipping LLM classifier eval"
